<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hookd | Digital Marketing & Creative Media</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --primary-red: #e61e25; /* Matches the 'd' in your logo */
            --glow-red: rgba(230, 30, 37, 0.6);
            --text-white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Subtle animated background gradient */
        .bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--glow-red) 0%, rgba(0,0,0,0) 70%);
            filter: blur(80px);
            z-index: -1;
            animation: pulse 8s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.2); }
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 800px;
            z-index: 1;
        }

        

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 10px;
            animation: fadeIn 2s ease-in;
        }

        .coming-soon {
            color: var(--primary-red);
            text-shadow: 0 0 20px var(--primary-red), 0 0 40px var(--primary-red);
            font-weight: 700;
        }

        p {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 40px;
            letter-spacing: 2px;
            animation: fadeInUp 2s ease-out;
        }

        /* Email Capture Form */
        .notify-form {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            animation: fadeInUp 2.5s ease-out;
        }

        input[type="email"] {
            padding: 15px 25px;
            border-radius: 50px;
            border: 1px solid #333;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            width: 300px;
            outline: none;
            transition: 0.3s;
        }

        input[type="email"]:focus {
            border-color: var(--primary-red);
            box-shadow: 0 0 15px var(--glow-red);
        }

        button {
            padding: 15px 35px;
            border-radius: 50px;
            border: none;
            background-color: var(--primary-red);
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            box-shadow: 0 0 15px var(--glow-red);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px var(--primary-red);
        }

        .socials {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 20px;
            animation: fadeIn 3s ease-in;
        }

        .socials a {
            color: #555;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .socials a:hover {
            color: var(--primary-red);
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .notify-form { flex-direction: column; align-items: center; }
            input[type="email"] { width: 100%; }
        }

        .logo {
    width: 300px;
    max-width: 80%;
    margin-bottom: 40px;

    /* Screen Blend Effect */
    mix-blend-mode: screen;
 border-radius: 50%;

   
    
}
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <!-- Replace 'logo.png' with your actual file path -->
        <img src="./logo.png.png" alt="Hookd Logo" class="logo">
        
        <h1>WE ARE <span class="coming-soon">COMING SOON</span></h1>
        <p>GET READY TO BE HOOKD. SOMETHING CREATIVE IS BREWING.</p>

        <form class="notify-form">
            <input type="email" placeholder="Enter your email" required>
            <button type="submit">Notify Me</button>
        </form>

      
    </div>

</body>
</html>
